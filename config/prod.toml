# rof-convert 生产环境配置
# 使用方式：ROF_ENV=prod；敏感信息通过环境变量注入，不要写入本文件。
# 环境变量会覆盖这里的值，例如 ROF_API_KEYS、ROF_TEMP_DIR。

[server]
host = "0.0.0.0"
port = 8080
max_upload_mb = 50
request_timeout_secs = 300

[conversion]
# 生产环境建议使用绝对路径，或通过 ROF_SOFFICE_BIN 覆盖
soffice_bin = "soffice"
timeout_secs = 120
# 同时运行的 soffice 进程数，建议约等于容器 CPU limit（单位为核）
# 16 核约可支撑 50 个并发提交：16 个立即执行，其余排队，内存建议不小于 8 GiB
max_concurrency = 16
# 排队 + 运行的任务总数上限，约为并发数的 4 倍；低于期望并发数会返回 503
max_active_jobs = 200
job_ttl_secs = 3600

[storage]
# 部署时确保该目录对运行用户可写，权限建议 0700
temp_dir = "/var/lib/rof-convert/tmp"

[auth]
# 生产环境应通过 ROF_API_KEYS 注入密钥；留空表示关闭鉴权（不推荐）
api_keys = []

[cors]
# 例如 ["https://console.example.com"]，或单独使用 ["*"]
allowed_origins = []

[logging]
format = "json"
filter = "rof_convert=info"

[docs]
# 生产环境保持关闭：不注册 Swagger UI（/api/v1/docs）与 OpenAPI 契约（/api/v1/openapi.json）
enabled = false
