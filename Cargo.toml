[package]
name = "rof-convert"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["ieayoio"]

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
hex = "0.4.3"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "process", "fs", "io-util", "time", "sync", "net"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["v4"] }
